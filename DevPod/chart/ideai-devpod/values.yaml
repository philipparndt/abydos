# A development pod.
#
# It runs the supervisor and nothing else until a binary is pushed into it, so
# the deployment can exist before anything has been built. Everything below is
# meant to be set to whatever the real chart sets, because the point is a pod
# that differs from production in one way only: what runs inside it.

image:
  repository: ideai-devpod
  tag: dev
  # Never on a local cluster where the image was imported rather than pulled;
  # IfNotPresent once it comes from a registry.
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# What the program is given, exactly as the recipe or the real chart gives it.
app:
  args: []
  workdir: /app
  env: {}
  # The real ConfigMaps and Secrets, so the pod sees the configuration
  # production sees.
  envFrom: []
  # Ports the program itself serves. The Service publishes these.
  ports:
    - name: http
      containerPort: 8080
    - name: pprof
      containerPort: 6060

supervisor:
  controlPort: 7999
  debugPort: 2345
  # A binary already in the pod is started again when the container restarts.
  autoStart: true

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  # Published in addition to the app's ports, so a profiler or a debugger can
  # be reached without a port-forward when the cluster allows it.
  exposeControlPorts: false

# Extra labels on the pod. Set these to the real workload's selector labels to
# have its Service send traffic here instead.
podLabels: {}
podAnnotations:
  # Read by ideai's profiler when it lists pods.
  goprofiler.io/port: "6060"

replicaCount: 1

# Answered by the supervisor, never by the program: a pod whose readiness
# depends on a program somebody is stepping through gets restarted in the
# middle of the session.
probes:
  enabled: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext: {}
securityContext: {}

# Where the pushed binary lives.
#
# An emptyDir by default. On a cluster running on the same machine as the
# editor, point this at a directory the editor writes to and the binary needs
# no transfer at all — the fastest loop there is.
storage:
  hostPath: ""

volumes: []
volumeMounts: []
