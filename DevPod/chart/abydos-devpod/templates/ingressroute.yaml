{{- if and .Values.ingress.enabled (eq (include "ideai-devpod.ingressKind" .) "traefik") }}
{{- if not .Values.ingress.host }}{{ fail "ingress.host is required when ingress.enabled" }}{{ end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ideai-devpod.fullname" . }}
  labels:
    {{- include "ideai-devpod.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.traefik.entryPoints | nindent 4 }}
  routes:
    # Traefik's own matcher rather than a path prefix in a rule: it is what the
    # rest of a Traefik cluster's manifests are written in.
    - match: Host(`{{ .Values.ingress.host }}`){{ if ne .Values.ingress.path "/" }} && PathPrefix(`{{ .Values.ingress.path }}`){{ end }}
      kind: Rule
      services:
        - name: {{ include "ideai-devpod.fullname" . }}
          port: {{ include "ideai-devpod.routePort" . }}
      {{- with .Values.ingress.traefik.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- with .Values.ingress.traefik.tlsSecretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
