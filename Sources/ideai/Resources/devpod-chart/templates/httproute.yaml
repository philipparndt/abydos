{{- if and .Values.ingress.enabled (eq (include "ideai-devpod.ingressKind" .) "gateway") }}
{{- if not .Values.ingress.host }}{{ fail "ingress.host is required when ingress.enabled" }}{{ end }}
{{- if not .Values.ingress.gateway.name }}{{ fail "ingress.gateway.name is required for a Gateway API route" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ideai-devpod.fullname" . }}
  labels:
    {{- include "ideai-devpod.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway.name }}
      {{- with .Values.ingress.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.ingress.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.path }}
      backendRefs:
        - name: {{ include "ideai-devpod.fullname" . }}
          port: {{ include "ideai-devpod.routePort" . }}
{{- end }}
