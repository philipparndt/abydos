{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ideai-devpod.fullname" . }}
  labels:
    {{- include "ideai-devpod.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ideai-devpod.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.app.ports }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
    {{- end }}
    {{- if .Values.service.exposeControlPorts }}
    - name: control
      port: {{ .Values.supervisor.controlPort }}
      targetPort: control
    - name: debug
      port: {{ .Values.supervisor.debugPort }}
      targetPort: debug
    {{- end }}
{{- end }}
