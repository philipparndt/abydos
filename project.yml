name: Abydos

# The Xcode project is generated from this file and is not checked in. The
# package is still the source of truth: the app target is the window layer,
# `Sources/AbydosMain`, and everything under it comes from the SwiftPM package
# door — the same one `swift build` uses, so the two builds cannot drift.
options:
  bundleIdPrefix: de.rnd7
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # The .xcodeproj is generated and gitignored, so the team lives here:
    # setting it in Xcode would not survive the next `make xcode`.
    DEVELOPMENT_TEAM: 643R6YSRER

packages:
  Abydos:
    path: .

targets:
  Abydos:
    type: application
    platform: macOS
    sources:
      # Four lines: the window layer is a library of the package, so Xcode and
      # SwiftPM build the same sources with one dependency graph between them.
      - path: Sources/AbydosMain
      # Folder references: the fonts are read by name at launch, and the icon
      # and notices travel with the app.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The icon as a catalog: what Xcode shows in the target editor, and
      # what App Store Connect wants. The .icns stays for `make bundle`,
      # which has no compiler to build a catalog with; both are made from
      # the same PNGs.
      - path: Resources/Assets.xcassets
      - path: Resources/Icon/Abydos.icns
        buildPhase: resources
        optional: true
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
        optional: true
    dependencies:
      - package: Abydos
        product: AbydosApp
    settings:
      base:
        # `ideai` on purpose, and the last of that name left here. It is the
        # identifier the app has shipped under and the one in
        # `Resources/Info.plist`, so it is what macOS has the Local Network grant
        # filed against. An Xcode build under a different identifier is a second
        # app as far as the system is concerned, and it takes that grant away
        # from the installed one — the day-long diagnosis the house rules about
        # BUNDLE_ID exist to prevent.
        PRODUCT_BUNDLE_IDENTIFIER: de.rnd7.ideai
        PRODUCT_NAME: Abydos
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        # The app talks to git, kubectl, helm and a shell, none of which a
        # sandboxed process can reach.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Abydos:
    build:
      targets:
        Abydos: all
    run:
      config: Debug
    archive:
      config: Release
